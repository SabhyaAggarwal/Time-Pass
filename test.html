<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Countdown Test - 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0a0e27, #16213e, #1a1a2e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: floatContainer 6s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .time-display {
            font-family: 'Orbitron', monospace;
            font-size: 100px;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(100, 200, 255, 0.6),
                0 0 30px rgba(100, 200, 255, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            letter-spacing: 8px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { 
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.8),
                    0 0 20px rgba(100, 200, 255, 0.6),
                    0 0 30px rgba(100, 200, 255, 0.4),
                    0 5px 15px rgba(0, 0, 0, 0.5);
            }
            50% { 
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 1),
                    0 0 30px rgba(100, 200, 255, 0.8),
                    0 0 40px rgba(100, 200, 255, 0.6),
                    0 5px 15px rgba(0, 0, 0, 0.5);
            }
        }

        .date-display {
            font-size: 28px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .countdown {
            font-family: 'Orbitron', monospace;
            font-size: 250px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 1),
                0 0 40px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 215, 0, 0.6),
                0 0 80px rgba(255, 165, 0, 0.4),
                0 10px 30px rgba(0, 0, 0, 0.7);
            animation: countdownPulse 1s infinite;
            display: none;
        }

        @keyframes countdownPulse {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.15);
                filter: brightness(1.3);
            }
        }

        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: linear-gradient(-45deg, #0a0e27, #16213e, #1a1a2e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        .celebration.active {
            display: block;
        }

        .happy-new-year {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', monospace;
            font-size: 100px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 1),
                0 0 40px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 165, 0, 0.6),
                0 0 80px rgba(255, 140, 0, 0.4),
                0 10px 40px rgba(0, 0, 0, 0.8);
            animation: celebrationBounce 2s ease-in-out;
            z-index: 101;
            letter-spacing: 5px;
        }

        @keyframes celebrationBounce {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(-10deg);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(5deg);
            }
            70% {
                transform: translate(-50%, -50%) scale(0.95) rotate(-2deg);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            font-size: 120px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            animation: floatUp 10s ease-in-out infinite;
        }

        .balloon:nth-child(1) { left: 5%; animation-delay: 0s; }
        .balloon:nth-child(2) { left: 20%; animation-delay: 1s; font-size: 100px; }
        .balloon:nth-child(3) { left: 35%; animation-delay: 2s; font-size: 130px; }
        .balloon:nth-child(4) { left: 50%; animation-delay: 1.5s; font-size: 110px; }
        .balloon:nth-child(5) { left: 65%; animation-delay: 0.5s; font-size: 125px; }
        .balloon:nth-child(6) { left: 80%; animation-delay: 2.5s; font-size: 105px; }
        .balloon:nth-child(7) { left: 95%; animation-delay: 1.8s; font-size: 115px; }

        @keyframes floatUp {
            0% {
                bottom: -150px;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translateX(30px) rotate(8deg);
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 110vh;
                transform: translateX(-30px) rotate(-8deg);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffd700;
            animation: fall 4s linear infinite;
            border-radius: 2px;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                top: 110%;
                transform: translateX(100px) rotate(720deg);
                opacity: 0.5;
            }
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
            animation: explode 1.5s ease-out infinite;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .year-2026 {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', monospace;
            font-size: 140px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700, #ffb700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s ease-in-out infinite, fadeInUp 2.5s ease-in-out;
            z-index: 101;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }

        @keyframes shine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .test-notice {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 15px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="test-notice">TEST MODE - Starting at 11:59:30 PM</div>
    
    <div class="container">
        <div class="time-display" id="time"></div>
        <div class="date-display" id="date"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <div class="celebration" id="celebration">
        <div class="happy-new-year">Happy New Year!</div>
        <div class="year-2026">🎈 2026 🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
    </div>

    <script>
        // Create animated stars background
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }
        
        createStars();
        
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        const countdownDisplay = document.getElementById('countdown');
        const celebration = document.getElementById('celebration');
        
        let celebrationStarted = false;
        
        // Start at 11:59:30 PM on December 31, 2025 in GST
        // Create a date object that will display as 23:59:30 in local time
        let testTime = new Date(2025, 11, 31, 23, 59, 30); // Month is 0-indexed, so 11 = December

        function updateTime() {
            // Increment test time by 1 second each call
            testTime = new Date(testTime.getTime() + 1000);
            
            let hours = testTime.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12
            const hoursStr = String(hours).padStart(2, '0');
            const minutes = String(testTime.getMinutes()).padStart(2, '0');
            const seconds = String(testTime.getSeconds()).padStart(2, '0');
            
            timeDisplay.textContent = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.textContent = testTime.toLocaleDateString('en-US', options);

            // Check if it's New Year (midnight on January 1st)
            if (testTime.getMonth() === 0 && testTime.getDate() === 1 && 
                testTime.getHours() === 0 && testTime.getMinutes() === 0 && testTime.getSeconds() < 30 && !celebrationStarted) {
                startCelebration();
            }

            // Check if we're in the last 10 seconds before midnight on Dec 31st
            if (testTime.getMonth() === 11 && testTime.getDate() === 31 && 
                testTime.getHours() === 23 && testTime.getMinutes() === 59 && testTime.getSeconds() >= 50) {
                const secondsLeft = 60 - testTime.getSeconds();
                countdownDisplay.style.display = 'block';
                countdownDisplay.textContent = secondsLeft;
                timeDisplay.style.display = 'none';
                dateDisplay.style.display = 'none';
            } else if (countdownDisplay.style.display === 'block' && !celebrationStarted) {
                countdownDisplay.style.display = 'none';
                timeDisplay.style.display = 'block';
                dateDisplay.style.display = 'block';
            }
        }

        function startCelebration() {
            celebrationStarted = true;
            celebration.classList.add('active');
            timeDisplay.style.display = 'none';
            dateDisplay.style.display = 'none';
            countdownDisplay.style.display = 'none';
            
            // Create confetti
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    createConfetti();
                }, i * 50);
            }
            
            // Create fireworks for 1 minute, then stop to prevent memory leaks
            const fireworksInterval = setInterval(() => {
                createFirework();
            }, 500);
            
            // Stop fireworks after 60 seconds
            setTimeout(() => {
                clearInterval(fireworksInterval);
            }, 60000);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            const colors = ['#ffd700', '#ff69b4', '#00ff00', '#00bfff', '#ff4500', '#9370db', '#ff1493', '#00ced1', '#ffa500'];
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // Random size for variety
            const size = Math.random() * 8 + 8;
            confetti.style.width = size + 'px';
            confetti.style.height = size + 'px';
            
            celebration.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 8000);
        }

        function createFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.5;
            
            const colors = ['#ffd700', '#ff69b4', '#00ff00', '#00bfff', '#ff4500', '#9370db'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = color;
                
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                celebration.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }
        }

        // Update time every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
