<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Countdown Test - 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .time-display {
            font-size: 80px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        .date-display {
            font-size: 24px;
            color: #fff;
            margin-bottom: 40px;
        }

        .countdown {
            font-size: 200px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: pulse 1s infinite;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }

        .celebration.active {
            display: block;
        }

        .happy-new-year {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
            animation: fadeInScale 2s ease-in-out;
            z-index: 101;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            font-size: 100px;
            animation: floatUp 8s ease-in-out infinite;
        }

        .balloon:nth-child(1) { left: 10%; animation-delay: 0s; }
        .balloon:nth-child(2) { left: 25%; animation-delay: 1s; }
        .balloon:nth-child(3) { left: 40%; animation-delay: 2s; }
        .balloon:nth-child(4) { left: 55%; animation-delay: 1.5s; }
        .balloon:nth-child(5) { left: 70%; animation-delay: 0.5s; }
        .balloon:nth-child(6) { left: 85%; animation-delay: 2.5s; }

        @keyframes floatUp {
            0% {
                bottom: -150px;
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(20px) rotate(5deg);
            }
            100% {
                bottom: 110vh;
                transform: translateX(-20px) rotate(-5deg);
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: fall 5s linear infinite;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                top: 110%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1.5s ease-out infinite;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .year-2026 {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
            animation: fadeIn 3s ease-in-out;
            z-index: 101;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .test-notice {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="test-notice">TEST MODE - Starting at 11:59:30 PM</div>
    
    <div class="container">
        <div class="time-display" id="time"></div>
        <div class="date-display" id="date"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <div class="celebration" id="celebration">
        <div class="happy-new-year">Happy New Year!</div>
        <div class="year-2026">🎈 2026 🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
    </div>

    <script>
        const timeDisplay = document.getElementById('time');
        const dateDisplay = document.getElementById('date');
        const countdownDisplay = document.getElementById('countdown');
        const celebration = document.getElementById('celebration');
        
        let celebrationStarted = false;
        
        // Start at 11:59:30 PM on December 31, 2025 in GST
        // Create a date object that will display as 23:59:30 in local time
        let testTime = new Date(2025, 11, 31, 23, 59, 30); // Month is 0-indexed, so 11 = December

        function updateTime() {
            // Increment test time by 1 second each call
            testTime = new Date(testTime.getTime() + 1000);
            
            let hours = testTime.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12
            const hoursStr = String(hours).padStart(2, '0');
            const minutes = String(testTime.getMinutes()).padStart(2, '0');
            const seconds = String(testTime.getSeconds()).padStart(2, '0');
            
            timeDisplay.textContent = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.textContent = testTime.toLocaleDateString('en-US', options);

            // Check if it's New Year (midnight on January 1st)
            if (testTime.getMonth() === 0 && testTime.getDate() === 1 && 
                testTime.getHours() === 0 && testTime.getMinutes() === 0 && testTime.getSeconds() < 30 && !celebrationStarted) {
                startCelebration();
            }

            // Check if we're in the last 10 seconds before midnight on Dec 31st
            if (testTime.getMonth() === 11 && testTime.getDate() === 31 && 
                testTime.getHours() === 23 && testTime.getMinutes() === 59 && testTime.getSeconds() >= 50) {
                const secondsLeft = 60 - testTime.getSeconds();
                countdownDisplay.style.display = 'block';
                countdownDisplay.textContent = secondsLeft;
                timeDisplay.style.display = 'none';
                dateDisplay.style.display = 'none';
            } else if (countdownDisplay.style.display === 'block' && !celebrationStarted) {
                countdownDisplay.style.display = 'none';
                timeDisplay.style.display = 'block';
                dateDisplay.style.display = 'block';
            }
        }

        function startCelebration() {
            celebrationStarted = true;
            celebration.classList.add('active');
            timeDisplay.style.display = 'none';
            dateDisplay.style.display = 'none';
            countdownDisplay.style.display = 'none';
            
            // Create confetti
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    createConfetti();
                }, i * 50);
            }
            
            // Create fireworks
            setInterval(() => {
                createFirework();
            }, 500);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            confetti.style.animationDuration = (Math.random() * 3 + 3) + 's';
            
            const colors = ['#ffd700', '#ff69b4', '#00ff00', '#00bfff', '#ff4500', '#9370db'];
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            celebration.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 8000);
        }

        function createFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.5;
            
            const colors = ['#ffd700', '#ff69b4', '#00ff00', '#00bfff', '#ff4500', '#9370db'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = color;
                
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                celebration.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }
        }

        // Update time every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
